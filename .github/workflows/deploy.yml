name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Inyectar número de versión en el service worker
        run: |
          VERSION="${GITHUB_SHA::8}-$(date +%s)"
          sed -i "s/__VERSION__/${VERSION}/g" sw.js
          echo "Versión publicada: ${VERSION}"

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar los archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
